<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trendy Kim Spa - Servicios de uñas y cabello.">
    <title>Trendy Kim | Spa de Belleza</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header></header>

    <main>
        <!-- PRESENTACIÓN DE LA DUEÑA -->
        <section class="presentacion-duena">
            <div class="container">
                <img
                    src="assets/duena-trendy-kim.JPG"
                    alt="Dueña de Trendy Kim Spa"
                    class="foto-duena"
                >
            </div>
        </section>

        <!-- SERVICIOS DE UÑAS -->
        <section class="servicios-unas" id="unas-tradicional">
            <div class="container">
                <div class="encabezado-servicios">
                    <span class="eyebrow">Cuidado y belleza</span>
                    <h1>Uñas tradicional</h1>
                    <p>Un cuidado especial para tus manos y pies.</p>
                </div>

                <div class="lista-servicios">
                    <article class="servicio-item">
                        <span>Limpieza manos</span>
                        <span class="precio">$15.000</span>
                    </article>
                    <article class="servicio-item">
                        <span>Limpieza pies</span>
                        <span class="precio">$18.000</span>
                    </article>
                    <article class="servicio-item">
                        <span>Tradicional manos - mujer</span>
                        <span class="precio">$20.000</span>
                    </article>
                    <article class="servicio-item">
                        <span>Tradicional pies - mujer</span>
                        <span class="precio">$25.000</span>
                    </article>
                    <article class="servicio-item">
                        <span>Tradicional manos - hombre</span>
                        <span class="precio">$18.000</span>
                    </article>
                    <article class="servicio-item">
                        <span>Tradicional pies - hombre</span>
                        <span class="precio">$20.000</span>
                    </article>
                </div>
            </div>
        </section>
    </main>

    <footer></footer>
    <script src="script.js"></script>
</body>
</html>
